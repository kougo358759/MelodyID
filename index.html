<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鼻歌検索アプリ</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            flex-direction: column;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #record-button,
        #result {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #006edc;
            color: white;
            transition: background-color 0.3s ease;
        }

        #record-button:hover {
            background-color: #005bb5;
        }

        #album-cover {
            margin-top: 20px;
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #tracklist {
            margin-top: 20px;
            list-style-type: none;
            padding: 0;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }

        .glass-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 800px;
        }

        .spotify-player {
            width: 300px;
            height: 80px;
            margin-top: 10px;
            border-radius: 10px;
        }

        .playback-container {
            margin-top: 20px;
        }

        /* ビジュアライザーのスタイル */
        #visualizer {
            margin-top: 20px;
            width: 600px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="glass-background"></div>
    <div class="content">
        <h2>鼻歌検索アプリ</h2>
        <button id="record-button">録音開始</button>
        <p id="status">準備完了</p>
        <p id="result">ここに結果が表示されます</p>
        <img id="album-cover" src="" alt="Album Cover">
        <ul id="tracklist"></ul>
        <div class="playback-container">
            <h3>現在の曲を再生:</h3>
            <iframe id="spotify-player" class="spotify-player" frameborder="0" allow="encrypted-media"></iframe>
        </div>
        <canvas id="visualizer" width="600" height="100"></canvas>
    </div>

    <script>
        const API_TOKEN = "5b2813256bf22676ce9628aadc635320"; // AudD APIトークンを入力
        const SPOTIFY_CLIENT_ID = "325d00d5d2334a68ab8c04f9d92a3114"; // SpotifyのクライアントIDを入力
        const SPOTIFY_CLIENT_SECRET = "57fbfb8203ea4234813cd88a529f6a32"; // Spotifyのクライアントシークレットを入力
        const API_URL = "https://api.audd.io/";

        let mediaRecorder;
        let audioChunks = [];
        let stream;  // グローバル変数として定義

        // ビジュアライザー用の変数
        let audioContext;
        let analyser;
        let dataArray;
        let bufferLength;
        let canvas;
        let canvasContext;

        document.getElementById("record-button").onclick = async function () {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                await startRecording();
            } else {
                stopRecording();
            }
        };

        async function startRecording() {
            document.getElementById("status").textContent = "録音中...";

            // オーディオストリームの取得と録音の準備
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
                audioChunks = [];
                stream.getTracks().forEach(track => track.stop());  // マイクをオフにする
                await sendAudioToApi(audioBlob);  // 解析開始

                // オーディオコンテキストを閉じる
                if (audioContext) {
                    audioContext.close();
                }
            };

            mediaRecorder.start();

            // オーディオビジュアライザーのセットアップ
            setupVisualizer(stream);
        }

        function stopRecording() {
            document.getElementById("status").textContent = "録音停止";
            mediaRecorder.stop();
        }

        async function sendAudioToApi(audioBlob) {
            document.getElementById("status").textContent = "検索中...";
            const formData = new FormData();
            formData.append("file", audioBlob);
            formData.append("api_token", API_TOKEN);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (result.status === "success" && result.result) {
                    const songTitle = result.result.title;
                    const artist = result.result.artist;
                    document.getElementById("result").innerHTML = `曲名: ${songTitle} アーティスト: ${artist}`;
                    fetchSpotifyTrack(songTitle, artist); // 楽曲検索後にプレイヤーの設定
                } else {
                    document.getElementById("result").textContent = "一致する楽曲が見つかりませんでした。";
                    document.getElementById("album-cover").style.display = 'none';
                    document.getElementById("tracklist").innerHTML = '';
                }
            } catch (error) {
                document.getElementById("result").textContent = "エラーが発生しました。再試行してください。";
                console.error("Error:", error);
            } finally {
                document.getElementById("status").textContent = "準備完了";
            }
        }

        async function getSpotifyToken() {
            const response = await fetch("https://accounts.spotify.com/api/token", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Authorization": "Basic " + btoa(SPOTIFY_CLIENT_ID + ":" + SPOTIFY_CLIENT_SECRET)
                },
                body: "grant_type=client_credentials"
            });
            const data = await response.json();
            return data.access_token;
        }

        async function fetchSpotifyTrack(songTitle, artist) {
            const token = await getSpotifyToken();
            const searchUrl = `https://api.spotify.com/v1/search?q=track:${encodeURIComponent(songTitle)}%20artist:${encodeURIComponent(artist)}&type=track&limit=1`;

            try {
                const response = await fetch(searchUrl, {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                const searchData = await response.json();

                if (searchData.tracks.items.length > 0) {
                    const trackId = searchData.tracks.items[0].id;
                    const albumId = searchData.tracks.items[0].album.id;
                    document.getElementById("spotify-player").src = `https://open.spotify.com/embed/track/${trackId}`;
                    fetchSpotifyAlbumTracks(albumId, token); // アルバムの曲リストを取得
                } else {
                    document.getElementById("result").textContent = "Spotifyで一致する曲が見つかりませんでした。";
                }
            } catch (error) {
                console.error("Spotify API Error:", error);
            }
        }

        async function fetchSpotifyAlbumTracks(albumId, token) {
            const albumResponse = await fetch(`https://api.spotify.com/v1/albums/${albumId}`, {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });
            const albumData = await albumResponse.json();
            const tracklist = document.getElementById("tracklist");
            tracklist.innerHTML = '';

            albumData.tracks.items.forEach(track => {
                const trackItem = document.createElement("li");

                const trackIframe = document.createElement("iframe");
                trackIframe.src = `https://open.spotify.com/embed/track/${track.id}`;
                trackIframe.width = "300";
                trackIframe.height = "80";
                trackIframe.frameBorder = "0";
                trackIframe.allow = "encrypted-media";
                trackIframe.classList.add("spotify-player");

                trackItem.appendChild(trackIframe);
                tracklist.appendChild(trackItem);
            });

            const albumCoverUrl = albumData.images[0].url;
            document.getElementById("album-cover").src = albumCoverUrl;

            // 背景画像を設定
            document.body.style.backgroundImage = `url(${albumCoverUrl})`;
        }

        function setupVisualizer(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            canvas = document.getElementById("visualizer");
            canvasContext = canvas.getContext("2d");

            drawVisualizer();
        }

        function drawVisualizer() {
            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;

            canvasContext.clearRect(0, 0, WIDTH, HEIGHT);

            function draw() {
                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(dataArray);

                // 背景を半透明にして前回のフレームを少し残す
                canvasContext.fillStyle = "rgba(0, 0, 0, 0.5)";
                canvasContext.fillRect(0, 0, WIDTH, HEIGHT);

                canvasContext.lineWidth = 2;
                canvasContext.strokeStyle = "rgb(0, 255, 0)";
                canvasContext.beginPath();

                const sliceWidth = WIDTH * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * HEIGHT / 2;

                    if (i === 0) {
                        canvasContext.moveTo(x, y);
                    } else {
                        canvasContext.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                canvasContext.lineTo(WIDTH, HEIGHT / 2);
                canvasContext.stroke();
            }

            draw();
        }
    </script>
</body>

</html>
